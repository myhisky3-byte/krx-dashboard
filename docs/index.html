<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KODEX · Korea Stock Intelligence</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070809;--bg2:#0f1115;--bg3:#181b21;--bg4:#1e222a;--border:#252932;--accent:#3b82f6;--accent2:#06b6d4;--green:#22c55e;--red:#f43f5e;--yellow:#eab308;--text:#f1f3f7;--sub:#8b95a8;--muted:#4b5263;--mono:'JetBrains Mono',monospace;--sans:'Pretendard',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden}
.layout{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.sidebar{border-right:1px solid var(--border);padding:24px 0;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--bg)}
.logo{padding:0 20px 24px;border-bottom:1px solid var(--border);margin-bottom:20px}
.logo-mark{font-size:11px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--accent);font-family:var(--mono);margin-bottom:3px}
.logo-sub{font-size:11px;color:var(--muted)}
.nav-section{padding:0 12px;margin-bottom:20px}
.nav-label{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:2px;text-transform:uppercase;padding:0 8px;margin-bottom:6px;font-family:var(--mono)}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--sub);transition:all .15s;text-decoration:none}
.nav-item:hover{background:var(--bg3);color:var(--text)}.nav-item.active{background:rgba(59,130,246,.12);color:var(--accent)}
.nav-icon{font-size:14px;width:18px;text-align:center}
.wl-side-item{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer;transition:background .15s}
.wl-side-item:hover{background:var(--bg3)}
.wl-sname{font-size:12px;font-weight:600}.wl-scode{font-size:9px;color:var(--muted);font-family:var(--mono)}
.wl-sprice{text-align:right}.wl-sv{font-size:11px;font-weight:700;font-family:var(--mono)}.wl-sc{font-size:10px;font-family:var(--mono)}
.up{color:var(--green)}.dn{color:var(--red)}.nc{color:var(--sub)}
.main{padding:28px 28px 60px;overflow:hidden}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;flex-wrap:wrap;gap:12px}
.page-title{font-size:18px;font-weight:800;letter-spacing:-.5px}
.update-badge{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border);padding:6px 12px;border-radius:20px;font-size:11px;color:var(--sub);font-family:var(--mono)}
.live-dot{width:6px;height:6px;background:var(--green);border-radius:50%;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.sec-label{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:14px;font-family:var(--mono);display:flex;align-items:center;gap:8px}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border)}
.fx-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px}
@media(max-width:900px){.fx-bar{grid-template-columns:repeat(2,1fr)}}
.fx-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;transition:border-color .2s}
.fx-card:hover{border-color:var(--accent2)}
.fx-pair{font-size:9px;color:var(--muted);font-family:var(--mono);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px}
.fx-rate{font-size:22px;font-weight:900;font-family:var(--mono);letter-spacing:-0.5px}
.fx-unit{font-size:10px;color:var(--sub);margin-left:2px}
.fx-chg{font-size:11px;font-weight:700;font-family:var(--mono);text-align:right}
.fx-flag{font-size:20px;margin-bottom:4px;text-align:right}
.metrics-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:36px}
.metric-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px;position:relative;overflow:hidden;transition:border-color .2s,transform .2s}
.metric-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.metric-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,var(--accent),transparent 60%)}
.mc-label{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:12px;font-family:var(--mono)}
.mc-value{font-size:36px;font-weight:900;font-family:var(--mono);line-height:1;margin-bottom:6px;letter-spacing:-1px}
.mc-sub{font-size:11px;color:var(--sub);margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;font-family:var(--mono)}
.chip-green{background:rgba(34,197,94,.12);color:var(--green)}.chip-blue{background:rgba(59,130,246,.12);color:var(--accent)}
.chip-yellow{background:rgba(234,179,8,.12);color:var(--yellow)}.chip-red{background:rgba(244,63,94,.12);color:var(--red)}
.buffett-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:36px;display:grid;grid-template-columns:auto 1fr;gap:36px;align-items:center}
.gauge-container{position:relative;width:200px;height:120px;flex-shrink:0}
.gauge-labels{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);font-family:var(--mono);margin-top:4px}
.gauge-center-val{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);text-align:center}
.gauge-center-val .gv{font-size:30px;font-weight:900;font-family:var(--mono)}.gauge-center-val .gu{font-size:11px;color:var(--sub)}
.buffett-info h3{font-size:16px;font-weight:800;margin-bottom:8px}.buffett-info p{font-size:13px;color:var(--sub);line-height:1.8;margin-bottom:14px}
.scale-row{display:flex;gap:6px;flex-wrap:wrap}.scale-chip{font-size:10px;padding:4px 10px;border-radius:6px;font-family:var(--mono)}
.ticker-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:36px}
.ticker-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.ticker-header h3{font-size:13px;font-weight:700}
.refresh-btn{background:var(--bg3);border:1px solid var(--border);color:var(--sub);padding:5px 12px;border-radius:6px;font-size:11px;cursor:pointer;font-family:var(--mono);transition:all .15s}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent)}
.ticker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ticker-card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px;transition:border-color .15s;cursor:pointer}
.ticker-card:hover{border-color:var(--accent)}
.tc-name{font-size:12px;font-weight:700;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-code{font-size:9px;color:var(--muted);font-family:var(--mono);margin-bottom:7px}
.tc-price{font-size:15px;font-weight:800;font-family:var(--mono);margin-bottom:2px}
.tc-chg{font-size:10px;font-family:var(--mono)}.tc-per{font-size:10px;color:var(--sub);margin-top:4px}
.watchlist-panel{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:22px;margin-bottom:36px}
.wl-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.wl-header h3{font-size:13px;font-weight:800}
.add-btn{background:var(--accent);color:white;border:none;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--sans)}
.add-btn:hover{opacity:.85}
.wl-table{width:100%;border-collapse:collapse}
.wl-table th{font-size:9px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);font-family:var(--mono)}
.wl-table td{padding:11px 10px;border-bottom:1px solid rgba(255,255,255,.02);font-size:13px}
.wl-table tr:hover td{background:rgba(255,255,255,.02)}.wl-table .num{font-family:var(--mono);text-align:right}
.signal-dot{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;font-family:var(--mono)}
.signal-dot::before{content:'';width:7px;height:7px;border-radius:50%}
.signal-dot.buy{color:var(--green)}.signal-dot.buy::before{background:var(--green)}
.signal-dot.hold{color:var(--yellow)}.signal-dot.hold::before{background:var(--yellow)}
.signal-dot.sell{color:var(--red)}.signal-dot.sell::before{background:var(--red)}
.del-btn{background:none;border:1px solid var(--border);color:var(--muted);width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.del-btn:hover{border-color:var(--red);color:var(--red)}
.add-form{display:none;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px;margin-top:12px;gap:8px;flex-wrap:wrap;align-items:flex-end}
.add-form.open{display:flex}
.add-form input{background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:8px;font-size:12px;font-family:var(--mono);width:140px}
.add-form input:focus{outline:none;border-color:var(--accent)}
.add-form button{background:var(--accent);color:white;border:none;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:36px}
.chart-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px}
.chart-card h3{font-size:12px;font-weight:700;margin-bottom:16px;color:var(--sub)}
.chart-wrap{position:relative;height:190px}
.sector-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:22px;margin-bottom:36px}
.sector-card h3{font-size:12px;font-weight:700;margin-bottom:16px;color:var(--sub)}
.sector-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.sector-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg3);border-radius:9px;transition:background .15s}
.sector-row:hover{background:var(--bg4)}
.sr-name{font-size:12px;font-weight:600;min-width:80px}.sr-per{font-size:13px;font-weight:800;font-family:var(--mono);min-width:40px;text-align:right}
.sr-bar-bg{flex:1;height:4px;background:var(--bg);border-radius:2px;overflow:hidden}
.sr-bar-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.sr-div{font-size:10px;color:var(--sub);font-family:var(--mono);min-width:34px;text-align:right}
.screener-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:22px;margin-bottom:36px}
.screener-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.screener-top h3{font-size:12px;font-weight:700;color:var(--sub)}
.filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:flex-end}
.filter-group{display:flex;flex-direction:column;gap:4px}
.filter-group label{font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;font-family:var(--mono)}
.filter-group input,.filter-group select{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:8px;font-size:12px;font-family:var(--mono);width:88px}
.filter-group input:focus,.filter-group select:focus{outline:none;border-color:var(--accent)}
.filter-btn{background:var(--accent);color:white;border:none;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;align-self:flex-end;font-family:var(--sans)}
.scr-table{width:100%;border-collapse:collapse;font-size:12px}
.scr-table th{font-size:9px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;text-align:left;padding:7px 10px;border-bottom:1px solid var(--border);font-family:var(--mono);cursor:pointer;user-select:none}
.scr-table th:hover{color:var(--accent)}
.scr-table td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.02)}
.scr-table tr:hover td{background:rgba(255,255,255,.02)}.scr-table .num{font-family:var(--mono);text-align:right}
.pager{display:flex;gap:5px;justify-content:center;margin-top:14px}
.pg-btn{background:var(--bg3);border:1px solid var(--border);color:var(--sub);padding:5px 11px;border-radius:6px;cursor:pointer;font-size:11px;font-family:var(--mono);transition:all .15s}
.pg-btn.on{background:var(--accent);color:white;border-color:var(--accent)}.pg-btn:hover:not(.on){border-color:var(--accent);color:var(--text)}
.loading{text-align:center;padding:80px 20px;color:var(--muted);font-family:var(--mono)}
.spin{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
footer{border-top:1px solid var(--border);padding:20px 0;text-align:center;font-size:10px;color:var(--muted);font-family:var(--mono);line-height:1.8}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--border)}.main{padding:16px 16px 40px}.metrics-grid{grid-template-columns:repeat(2,1fr)}.buffett-wrap{grid-template-columns:1fr}.charts-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
  <div class="logo">
    <div class="logo-mark">KRX · Val</div>
    <div class="logo-sub">한국 주식 밸류에이션</div>
  </div>
  <div class="nav-section">
    <div class="nav-label">메뉴</div>
    <a class="nav-item active" href="index.html"><span class="nav-icon">📊</span> 시장 개요</a>
    <a class="nav-item" href="ai_analysis.html"><span class="nav-icon">🤖</span> AI 종목 분석</a>
  </div>
  <div class="nav-section">
    <div class="nav-label">관심종목</div>
    <div id="sideWl"><div style="font-size:11px;color:var(--muted);padding:8px 10px">로딩 중...</div></div>
  </div>
</aside>
<main class="main">
  <div class="topbar">
    <div class="page-title">시장 개요</div>
    <div class="update-badge"><span class="live-dot"></span><span id="updateTime">—</span></div>
  </div>
  <div id="mainContent"><div class="loading"><div class="spin"></div>데이터 불러오는 중...</div></div>
</main>
</div>

<script>
const DEFAULT_WL=[{code:'005930',name:'삼성전자'},{code:'000660',name:'SK하이닉스'},{code:'035420',name:'NAVER'},{code:'005380',name:'현대차'},{code:'051910',name:'LG화학'},{code:'006400',name:'삼성SDI'},{code:'035720',name:'카카오'},{code:'000270',name:'기아'}];
const MAJOR=[{code:'005930',name:'삼성전자'},{code:'000660',name:'SK하이닉스'},{code:'035420',name:'NAVER'},{code:'005380',name:'현대차'},{code:'051910',name:'LG화학'},{code:'006400',name:'삼성SDI'},{code:'035720',name:'카카오'},{code:'000270',name:'기아'},{code:'068270',name:'셀트리온'},{code:'028260',name:'삼성물산'}];
let _prices={};let _allStocks=[];let _filtered=[];let _scrPage=1;let _scrDir={};

function getWL(){try{const s=localStorage.getItem('krx_wl');return s?JSON.parse(s):[...DEFAULT_WL];}catch{return[...DEFAULT_WL];}}
function saveWL(l){localStorage.setItem('krx_wl',JSON.stringify(l));}
function fmt(v,d=2){if(v==null||isNaN(v))return'N/A';return Number(v).toFixed(d);}
function fmtNum(v){if(!v)return'-';const t=v/1e6;return t>=1?t.toFixed(0)+'조':(v/10000).toFixed(0)+'억';}
function perChip(p){if(!p)return'';if(p<10)return'<span class="chip chip-green">저평가</span>';if(p<15)return'<span class="chip chip-blue">적정</span>';if(p<22)return'<span class="chip chip-yellow">고평가</span>';return'<span class="chip chip-red">과열</span>';}
function bChip(v){if(!v)return'';if(v<70)return'<span class="chip chip-green">저평가</span>';if(v<90)return'<span class="chip chip-blue">적정</span>';if(v<115)return'<span class="chip chip-yellow">고평가</span>';return'<span class="chip chip-red">위험</span>';}

async function fetchPrice(code){
  const sfx=['000660','035420','035720','068270'].includes(code)?'.KQ':'.KS';
  try{
    const r=await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${code}${sfx}?interval=1d&range=1d`);
    const d=await r.json();
    const m=d?.chart?.result?.[0]?.meta;
    if(!m)return null;
    const price=m.regularMarketPrice,prev=m.chartPreviousClose||m.previousClose;
    return{price,change:price-prev,pct:(price-prev)/prev*100};
  }catch{return null;}
}

async function loadPrices(list){
  for(const s of list){const p=await fetchPrice(s.code);if(p)_prices[s.code]=p;await new Promise(r=>setTimeout(r,150));}
}

async function main(){
  let data,history;
  try{
    [data,history]=await Promise.all([
      fetch('data.json?t='+Date.now()).then(r=>r.json()),
      fetch('history.json?t='+Date.now()).then(r=>r.json()).catch(()=>[])
    ]);
  }catch{
    document.getElementById('mainContent').innerHTML='<div style="background:rgba(244,63,94,.08);border:1px solid rgba(244,63,94,.25);color:var(--red);padding:20px;border-radius:12px;font-size:13px;">⚠️ 데이터 없음 — GitHub Actions에서 fetch_data.py를 먼저 실행하세요.</div>';
    return;
  }
  document.getElementById('updateTime').textContent=data.updated_at||'—';
  const kospi=data.kospi||{},kosdaq=data.kosdaq||{},buffett=data.buffett||{},sectors=data.sectors||[];
  _allStocks=data.stocks||[];_filtered=[..._allStocks];
  const wl=getWL();
  renderPage(kospi,kosdaq,buffett,sectors,history,wl);
  // 비동기 가격 로드
  await loadPrices([...MAJOR,...wl.filter(w=>!MAJOR.find(m=>m.code===w.code))]);
  renderTicker();renderSideWl();renderWlTable();
}

function renderPage(kospi,kosdaq,buffett,sectors,history,wl){
  document.getElementById('mainContent').innerHTML=`

  <div class="sec-label">실시간 환율</div>
  <div class="fx-bar" id="fxBar">
    <div class="fx-card"><div><div class="fx-pair">USD / KRW</div><div class="fx-rate" id="fx-usd">—<span class="fx-unit">원</span></div></div><div><div class="fx-flag">🇺🇸</div><div class="fx-chg nc" id="fx-usd-chg">—</div></div></div>
    <div class="fx-card"><div><div class="fx-pair">JPY / KRW</div><div class="fx-rate" id="fx-jpy">—<span class="fx-unit">원</span></div></div><div><div class="fx-flag">🇯🇵</div><div class="fx-chg nc" id="fx-jpy-chg">—</div></div></div>
    <div class="fx-card"><div><div class="fx-pair">EUR / KRW</div><div class="fx-rate" id="fx-eur">—<span class="fx-unit">원</span></div></div><div><div class="fx-flag">🇪🇺</div><div class="fx-chg nc" id="fx-eur-chg">—</div></div></div>
    <div class="fx-card"><div><div class="fx-pair">CNY / KRW</div><div class="fx-rate" id="fx-cny">—<span class="fx-unit">원</span></div></div><div><div class="fx-flag">🇨🇳</div><div class="fx-chg nc" id="fx-cny-chg">—</div></div></div>
  </div>

  <div class="sec-label">주요 지표</div>
  <div class="metrics-grid">
    <div class="metric-card"><div class="mc-label">KOSPI PER</div><div class="mc-value">${fmt(kospi.per)}</div><div class="mc-sub">주가수익비율(배)</div>${perChip(kospi.per)}</div>
    <div class="metric-card"><div class="mc-label">KOSPI PBR</div><div class="mc-value">${fmt(kospi.pbr)}</div><div class="mc-sub">주가순자산비율(배)</div><div class="mc-sub" style="margin-top:4px">배당 ${fmt(kospi.div_yield)}%</div></div>
    <div class="metric-card"><div class="mc-label">KOSDAQ PER</div><div class="mc-value">${fmt(kosdaq.per)}</div><div class="mc-sub">주가수익비율(배)</div>${perChip(kosdaq.per)}</div>

  <div class="sec-label">관심종목</div>
  <div class="watchlist-panel">

      <div class="filter-group"><label>PER 최소</label><input type="number" id="perMin" placeholder="0"></div>
      <div class="filter-group"><label>PER 최대</label><input type="number" id="perMax" placeholder="50"></div>

      <table class="scr-table">
        <thead><tr><th>종목명</th><th onclick="scrSort('per')" style="text-align:right">PER ↕</th><th onclick="scrSort('pbr')" style="text-align:right">PBR ↕</th><th onclick="scrSort('div_yield')" style="text-align:right">배당 ↕</th><th onclick="scrSort('market_cap')" style="text-align:right">시총 ↕</th><th>관심</th></tr></thead>
        <tbody id="scrBody"></tbody>

    <div class="pager" id="scrPager"></div>

  drawGauge(buffett.value);
  drawHistory(history);

function renderTicker(){
  const g=document.getElementById('tickerGrid');if(!g)return;
  const sm={};_allStocks.forEach(s=>sm[s.code]=s);
  g.innerHTML=MAJOR.map(s=>{
    const p=_prices[s.code],sv=sm[s.code]||{};
    const price=p?p.price.toLocaleString():'—';
    const chg=p?(p.pct>=0?'+':'')+p.pct.toFixed(2)+'%':'—';
    const cls=p?(p.pct>0?'up':p.pct<0?'dn':'nc'):'nc';
    return`<div class="ticker-card"><div class="tc-name">${s.name}</div><div class="tc-code">${s.code}</div><div class="tc-price">${price}<span style="font-size:9px;color:var(--sub)">원</span></div><div class="tc-chg ${cls}">${chg}</div>${sv.per?`<div class="tc-per">PER ${fmt(sv.per)}배</div>`:''}</div>`;
  }).join('');
}

function renderSideWl(){
  const el=document.getElementById('sideWl');if(!el)return;
  const wl=getWL();
  if(!wl.length){el.innerHTML='<div style="font-size:11px;color:var(--muted);padding:8px 10px">관심종목 없음</div>';return;}
  el.innerHTML=wl.slice(0,8).map(s=>{
    const p=_prices[s.code];
    const v=p?p.price.toLocaleString()+'원':'—';
    const c=p?(p.pct>=0?'+':'')+p.pct.toFixed(2)+'%':'';
    const cls=p?(p.pct>0?'up':p.pct<0?'dn':'nc'):'nc';
    return`<div class="wl-side-item"><div><div class="wl-sname">${s.name}</div><div class="wl-scode">${s.code}</div></div><div class="wl-sprice"><div class="wl-sv">${v}</div><div class="wl-sc ${cls}">${c}</div></div></div>`;
  }).join('');
}

function renderWlTable(){
  const body=document.getElementById('wlBody'),cnt=document.getElementById('wlCnt');
  if(!body)return;
  const wl=getWL();const sm={};_allStocks.forEach(s=>sm[s.code]=s);
  if(cnt)cnt.textContent=`(${wl.length}개)`;
  if(!wl.length){body.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:20px;font-size:12px">관심종목을 추가하세요</td></tr>';return;}
  body.innerHTML=wl.map(s=>{
    const p=_prices[s.code],sv=sm[s.code]||{};
    const price=p?p.price.toLocaleString():'—';
    const chg=p?(p.pct>=0?'+':'')+p.pct.toFixed(2)+'%':'—';
    const cls=p?(p.pct>0?'up':p.pct<0?'dn':'nc'):'nc';
    return`<tr><td><div style="font-weight:700">${s.name}</div><div style="font-size:10px;color:var(--muted);font-family:var(--mono)">${s.code}</div></td><td class="num" style="font-weight:700">${price}<span style="font-size:10px;color:var(--sub)">원</span></td><td class="num ${cls}">${chg}</td><td class="num">${fmt(sv.per)}</td><td class="num">${fmt(sv.pbr)}</td><td><button class="del-btn" onclick="delWl('${s.code}')">✕</button></td></tr>`;
  }).join('');
}

function toggleForm(){document.getElementById('addForm').classList.toggle('open');}
function addWl(){
  const code=document.getElementById('addCode').value.trim();
  const name=document.getElementById('addName').value.trim();
  if(!code||!name){alert('종목코드와 종목명을 입력하세요.');return;}
  if(!/^\d{6}$/.test(code)){alert('6자리 숫자 코드를 입력하세요.');return;}
  const wl=getWL();if(wl.find(s=>s.code===code)){alert('이미 추가된 종목입니다.');return;}
  wl.push({code,name});saveWL(wl);
  document.getElementById('addCode').value='';document.getElementById('addName').value='';
  document.getElementById('addForm').classList.remove('open');
  renderWlTable();renderSideWl();renderScr();
  fetchPrice(code).then(p=>{if(p)_prices[code]=p;renderWlTable();renderSideWl();});
}
function delWl(code){const wl=getWL().filter(s=>s.code!==code);saveWL(wl);renderWlTable();renderSideWl();renderScr();}

async function refreshAll(){
  const g=document.getElementById('tickerGrid');
  if(g)g.innerHTML='<div style="font-size:11px;color:var(--muted);font-family:var(--mono);grid-column:1/-1">새로고침 중...</div>';
  const wl=getWL();
  await loadPrices([...MAJOR,...wl.filter(w=>!MAJOR.find(m=>m.code===w.code))]);
  renderTicker();renderSideWl();renderWlTable();
}

function drawGauge(value){
  const c=document.getElementById('gaugeChart');if(!c)return;
  const v=value!=null?Math.min(150,value):85,pct=v/150;
  const color=v<70?'#22c55e':v<90?'#3b82f6':v<115?'#eab308':'#f43f5e';
  new Chart(c.getContext('2d'),{type:'doughnut',data:{datasets:[{data:[pct,1-pct],backgroundColor:[color,'#181b21'],borderWidth:0,circumference:180,rotation:270}]},options:{responsive:false,cutout:'72%',plugins:{legend:{display:false},tooltip:{enabled:false}}}});
}

function drawHistory(h){
  if(!h||h.length<2)return;
  const labels=h.map(x=>x.date.slice(5));
  const opts={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#4b5263',font:{size:10}}}},scales:{x:{ticks:{color:'#4b5263',font:{size:9},maxTicksLimit:7},grid:{color:'#1e222a'}},y:{ticks:{color:'#4b5263',font:{size:9}},grid:{color:'#1e222a'}}}};
  const pc=document.getElementById('perChart');
  if(pc)new Chart(pc,{type:'line',data:{labels,datasets:[{label:'코스피PER',data:h.map(x=>x.kospi_per),borderColor:'#3b82f6',backgroundColor:'rgba(59,130,246,.06)',tension:.35,pointRadius:0,borderWidth:2,fill:true},{label:'코스닥PER',data:h.map(x=>x.kosdaq_per),borderColor:'#06b6d4',backgroundColor:'transparent',tension:.35,pointRadius:0,borderWidth:1.5}]},options:opts});
  const bc=document.getElementById('bChart');
  if(bc)new Chart(bc,{type:'line',data:{labels,datasets:[{label:'버핏지수%',data:h.map(x=>x.buffett),borderColor:'#22c55e',backgroundColor:'rgba(34,197,94,.06)',tension:.35,pointRadius:0,borderWidth:2,fill:true}]},options:opts});
}

function renderSectors(sectors){
  const el=document.getElementById('sectorGrid');if(!el)return;
  const maxP=Math.max(...sectors.map(s=>s.per||0),1);
  el.innerHTML=sectors.map(s=>`<div class="sector-row"><div class="sr-name">${s.name}</div><div class="sr-per">${fmt(s.per,1)}</div><div class="sr-bar-bg"><div class="sr-bar-fill" style="width:${Math.min(100,(s.per/maxP)*100)}%"></div></div><div class="sr-div">${s.div_yield!=null?fmt(s.div_yield,1)+'%':'—'}</div></div>`).join('');
}

function applyFilter(){
  const pm=parseFloat(document.getElementById('perMin').value)||0;
  const px=parseFloat(document.getElementById('perMax').value)||9999;
  const bx=parseFloat(document.getElementById('pbrMax').value)||9999;
  const dm=parseFloat(document.getElementById('divMin').value)||0;
  const sk=document.getElementById('sortKey').value;
  let list=_allStocks.filter(s=>(s.per>=pm&&s.per<=px)&&(!s.pbr||s.pbr<=bx)&&(!s.div_yield||s.div_yield>=dm));
  if(sk==='per')list.sort((a,b)=>(a.per||9999)-(b.per||9999));
  else if(sk==='pbr')list.sort((a,b)=>(a.pbr||9999)-(b.pbr||9999));
  else if(sk==='div_yield')list.sort((a,b)=>(b.div_yield||0)-(a.div_yield||0));
  else list.sort((a,b)=>(b.market_cap||0)-(a.market_cap||0));
  _filtered=list;_scrPage=1;
  document.getElementById('scrCnt').textContent=list.length+'개 종목';
  renderScr();
}

function scrSort(key){_scrDir[key]=!_scrDir[key];_filtered.sort((a,b)=>{const av=a[key]||0,bv=b[key]||0;return _scrDir[key]?av-bv:bv-av;});_scrPage=1;renderScr();}

function renderScr(){
  const PAGE=20,list=_filtered,page=_scrPage,total=Math.ceil(list.length/PAGE);
  const slice=list.slice((page-1)*PAGE,page*PAGE);
  const body=document.getElementById('scrBody');if(!body)return;
  const wl=getWL();
  body.innerHTML=slice.map(s=>{
    const inWl=!!wl.find(w=>w.code===s.code);
    return`<tr><td><div style="font-weight:600">${s.name}</div><div style="font-size:10px;color:var(--muted);font-family:var(--mono)">${s.code}</div></td><td class="num">${fmt(s.per)}</td><td class="num">${fmt(s.pbr)}</td><td class="num">${s.div_yield!=null?fmt(s.div_yield)+'%':'—'}</td><td class="num">${fmtNum(s.market_cap)}</td><td><button onclick="${inWl?`delWl('${s.code}')`:` quickAdd('${s.code}','${s.name}')`}" style="background:${inWl?'rgba(244,63,94,.1)':'rgba(59,130,246,.1)'};border:1px solid ${inWl?'rgba(244,63,94,.3)':'rgba(59,130,246,.3)'};color:${inWl?'var(--red)':'var(--accent)'};padding:4px 10px;border-radius:6px;cursor:pointer;font-size:10px;font-family:var(--mono)">${inWl?'✕ 삭제':'+ 관심'}</button></td></tr>`;
  }).join('');
  const pager=document.getElementById('scrPager');if(!pager)return;
  let ph='';
  if(page>1)ph+=`<button class="pg-btn" onclick="scrGo(${page-1})">←</button>`;
  for(let i=Math.max(1,page-2);i<=Math.min(total,page+2);i++)ph+=`<button class="pg-btn ${i===page?'on':''}" onclick="scrGo(${i})">${i}</button>`;
  if(page<total)ph+=`<button class="pg-btn" onclick="scrGo(${page+1})">→</button>`;
  pager.innerHTML=ph;
}

function scrGo(p){_scrPage=p;renderScr();document.querySelector('.screener-card').scrollIntoView({behavior:'smooth',block:'start'});}
function quickAdd(code,name){const wl=getWL();if(wl.find(s=>s.code===code))return;wl.push({code,name});saveWL(wl);renderScr();renderSideWl();renderWlTable();}


// ── 환율 ─────────────────────────────────────
const FX_LIST = [
  {id:'usd', ticker:'USDKRW=X', flag:'🇺🇸', pair:'USD/KRW'},
  {id:'jpy', ticker:'JPYKRW=X', flag:'🇯🇵', pair:'JPY/KRW'},
  {id:'eur', ticker:'EURKRW=X', flag:'🇪🇺', pair:'EUR/KRW'},
  {id:'cny', ticker:'CNYKRW=X', flag:'🇨🇳', pair:'CNY/KRW'},
];

async function fetchFX(ticker){
  try{
    const r=await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1d&range=1d`);
    const d=await r.json();
    const m=d?.chart?.result?.[0]?.meta;
    if(!m)return null;
    const price=m.regularMarketPrice;
    const prev=m.chartPreviousClose||m.previousClose;
    return{price,pct:(price-prev)/prev*100,change:price-prev};
  }catch{return null;}
}

async function loadFX(){
  for(const fx of FX_LIST){
    const data=await fetchFX(fx.ticker);
    const rateEl=document.getElementById('fx-'+fx.id);
    const chgEl=document.getElementById('fx-'+fx.id+'-chg');
    if(rateEl&&data){
      // JPY는 100엔 기준으로 표시
      const rate=fx.id==='jpy'?data.price*100:data.price;
      const unit=fx.id==='jpy'?'원/100엔':'원';
      rateEl.innerHTML=rate.toFixed(fx.id==='jpy'?1:0)+'<span class="fx-unit">'+unit+'</span>';
      if(chgEl){
        const cls=data.pct>0?'up':data.pct<0?'dn':'nc';
        chgEl.className='fx-chg '+cls;
        chgEl.textContent=(data.pct>=0?'+':'')+data.pct.toFixed(2)+'%';
      }
    }
    await new Promise(r=>setTimeout(r,200));
  }
}

main();
loadFX();
setInterval(loadFX, 60000); // 1분마다 환율 자동 갱신
