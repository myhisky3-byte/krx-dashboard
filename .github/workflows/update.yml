name: 📊 매일 KRX 데이터 + AI 분석 업데이트

on:
  schedule:
    - cron: '30 9 * * 1-5'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 데이터 수집
        run: python fetch_data.py
      - name: AI 분석
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python fetch_ai_analysis.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "📊 자동 업데이트: $(date +'%Y-%m-%d')"
          git push
